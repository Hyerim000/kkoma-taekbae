
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬마 택배 놀이 마을</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#fff4e6;color:#70452c;
 font-family:system-ui,sans-serif
}
main{max-width:560px;margin:auto;padding:15px}
header{
 background:#ffd98e;border-radius:25px;
 padding:20px;text-align:center
}
h1{font-size:27px}
.card{
 background:white;border-radius:22px;
 padding:18px;margin-top:15px;
 box-shadow:0 3px 12px #70452c15
}
h2{text-align:center}
.item{
 display:flex;align-items:center;gap:12px;
 background:#fff6ea;padding:12px;
 border-radius:16px;margin:10px 0
}
.emoji{font-size:38px}
.grow{flex:1}
.price{font-size:13px;color:#98765c}
button{
 border:0;border-radius:15px;padding:13px 17px;
 background:#59a96a;color:white;
 font-size:16px;font-weight:bold
}
button:disabled{opacity:.4}
.full{width:100%;margin-top:12px}
.gray{background:#eee7df;color:#70452c}
.total{
 background:#fff0d9;padding:15px;
 border-radius:15px;margin-top:12px
}
.big{text-align:center;font-size:85px;margin:15px}
.stage{
 background:#e8f5ff;border-radius:20px;
 padding:20px;text-align:center;margin-top:15px
}
.notice{text-align:center;font-size:12px;margin:18px}
</style>
</head>
<body>
<main>
<header>
<div>🌟 3~4세 어린이 역할놀이 🌟</div>
<h1>🚚 꼬마 택배 놀이 마을</h1>
<p>고르고! 주문하고! 택배 준비해요!</p>
<div style="font-size:55px">🧸 🎁 📦</div>
</header>

<section id="app" class="card"></section>
<p class="notice">상상 속 쇼핑 놀이예요. 실제 결제와 배송은 없어요.</p>
</main>

<script>
const products=[
 {name:"색종이",emoji:"🎨",price:1000},
 {name:"아기 인형",emoji:"👶",price:5000},
 {name:"악기",emoji:"🥁",price:4000},
 {name:"벽돌 블록",emoji:"🧱",price:3000},
 {name:"레고 블록",emoji:"🧩",price:4500},
 {name:"도넛",emoji:"🍩",price:2000}
];

let cart=[];
let page="shop";

const app=document.getElementById("app");
const money=n=>n.toLocaleString("ko-KR")+"원";

function speak(message){
 if(!window.speechSynthesis)return;
 window.speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(message);
 speech.lang="ko-KR";
 speech.rate=0.9;
 speech.pitch=1.1;
 window.speechSynthesis.speak(speech);
}

function add(i){
 cart.push(products[i]);
 render();
}

function removeItem(i){
 cart.splice(i,1);
 render();
}

function order(){
 if(cart.length===0)return;

 // 버튼을 누른 순간 음성 안내 시작
 speak("주문이 완료되었어요! 상품을 준비할게요!");

 page="ordered";
 render();

 // 잠시 후 상품 준비 중 화면으로 자동 이동
 setTimeout(()=>{
  page="preparing";
  render();
 },1500);
}

function render(){

 if(page==="shop"){
  app.innerHTML=`
   <h2>🏪 장난감 가게</h2>
   <p style="text-align:center">마음에 드는 물건을 골라보세요!</p>
   ${products.map((p,i)=>`
    <div class="item">
     <div class="emoji">${p.emoji}</div>
     <div class="grow">
      <b>${p.name}</b>
      <div class="price">${money(p.price)}</div>
     </div>
     <button onclick="add(${i})">담기</button>
    </div>
   `).join("")}
   <div class="total">
    🧺 장바구니<br>
    ${cart.length?cart.map(p=>p.emoji+" "+p.name).join(" · "):"아직 물건이 없어요!"}
   </div>
   <button class="full" ${cart.length===0?"disabled":""}
    onclick="page='cart';render()">
    장바구니 확인하기 ➡️
   </button>
  `;
 }

 else if(page==="cart"){
  app.innerHTML=`
   <h2>🧺 내 장바구니</h2>
   ${cart.map((p,i)=>`
    <div class="item">
     <span class="emoji">${p.emoji}</span>
     <b class="grow">${p.name}</b>
     <span>${money(p.price)}</span>
     <button class="gray" onclick="removeItem(${i})">빼기</button>
    </div>
   `).join("")}
   <div class="total">
    총 놀이 금액: ${money(cart.reduce((a,p)=>a+p.price,0))}
   </div>
   <button class="full" onclick="order()">💛 주문하기</button>
   <button class="full gray" onclick="page='shop';render()">가게로 돌아가기</button>
  `;
 }

 else if(page==="ordered"){
  app.innerHTML=`
   <h2>🎉 주문 완료!</h2>
   <div class="big">📋</div>
   <h2 style="color:#27834c">주문이 접수되었어요!</h2>
   <p style="text-align:center">잠시만 기다려 주세요!</p>
   <div class="stage">
    <div class="big">📦</div>
    <h2>상품을 준비하고 있어요!</h2>
   </div>
  `;
 }

 else if(page==="preparing"){
  app.innerHTML=`
   <h2>📦 상품 준비 중!</h2>
   <div class="stage">
    <div class="big">🎁</div>
    <h2 style="color:#27834c">상품 준비 중이에요!</h2>
    <p>물건을 상자에 조심조심 담고 있어요!</p>
    <div style="font-size:55px">🧸 📦 🎀</div>
   </div>
   <div class="total">
    <b>내가 주문한 물건</b><br><br>
    ${cart.map(p=>p.emoji+" "+p.name).join("<br>")}
   </div>
   <button class="full" onclick="speak('택배 상자에 물건을 예쁘게 담고 있어요!')">
    🔊 음성으로 듣기
   </button>
   <button class="full gray" onclick="cart=[];page='shop';render()">
    🛍️ 다시 쇼핑하기
   </button>
  `;
 }
}

render();
</script>
</body>
</html>
